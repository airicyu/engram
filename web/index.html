<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Engram Lite</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <div class="shell">
      <div class="atmosphere" aria-hidden="true"></div>
      <aside class="sidebar" aria-label="主選單">
        <div class="brand">
          Engram
          <span class="brand-lite">Lite</span>
        </div>
        <nav class="side-nav" aria-label="導覽">
          <a href="#/events" data-nav="events" data-i18n="nav.events">
            <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
            <span class="nav-label">事件</span>
          </a>
          <a href="#/seek" data-nav="seek" data-i18n="nav.seek">
            <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16.2 16.2 4.3 4.3" />
            </svg>
            <span class="nav-label">尋問</span>
          </a>
          <a href="#/clarify" data-nav="clarify" data-i18n="nav.clarify">
            <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16v10.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5Z" />
              <path d="m4 7 8 6 8-6" />
            </svg>
            <span class="nav-label">提問郵箱</span>
          </a>
          <a href="#/memory" data-nav="memory" data-i18n="nav.memory">
            <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6.5" cy="12" r="2.25" />
              <circle cx="17.5" cy="6.5" r="2.25" />
              <circle cx="17.5" cy="17.5" r="2.25" />
              <path d="M8.4 10.8 15.4 7.6" />
              <path d="M8.4 13.2 15.4 16.4" />
            </svg>
            <span class="nav-label">記憶</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="status-row" role="status" aria-live="polite">
            <span class="status-light is-ready" aria-hidden="true"></span>
            <span class="status-label" data-i18n="status.ready">就緒</span>
          </div>
          <div class="locale-switch" role="group" aria-label="介面語言">
            <button type="button" class="locale-btn" data-locale="zh-Hant" aria-pressed="true">繁體中文</button>
            <button type="button" class="locale-btn" data-locale="en" aria-pressed="false">English</button>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <div id="job-banner" hidden></div>
        <main id="app">載入中…</main>
      </div>
    </div>
    <script src="/web/i18n.js"></script>
    <script src="/web/mention-composer.js"></script>
    <script src="/web/app.js"></script>
  </body>
</html>
